{% extends "base.html" %}

{% block title %}Register — IMS{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create an Account</h2>
    <p class="auth-subtitle">Select your role and start managing your internships</p>

    <form method="POST" action="{{ url_for('main.register') }}" class="auth-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="e.g. sana_dev">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="e.g. user@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Choose a strong password">
        </div>

        <div class="form-group">
            <label for="role">Select Your Role</label>
            <select name="role" id="role" required>
                <option value="Student">Student</option>
                <option value="Company">Company</option>
                <option value="University">University</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="{{ url_for('main.login') }}">Login here</a></p>
</div>
{% endblock %}
