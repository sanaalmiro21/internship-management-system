{% extends "base.html" %}

{% block title %}Login — IMS{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in with your email or username</p>

    <form method="POST" action="{{ url_for('main.login') }}" class="auth-form">
        <div class="form-group">
            <label for="identifier">Email or Username</label>
            <input type="text" id="identifier" name="identifier" required placeholder="e.g. admin@ims.edu or super_admin">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a></p>
</div>
{% endblock %}
