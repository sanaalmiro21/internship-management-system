{% extends "base.html" %}

{% block title %}Post New Internship — IMS{% endblock %}

{% block content %}
<div class="container" style="max-width: 720px; margin: 2rem auto;">
    <div class="dashboard-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <h2 style="margin: 0; color: #0F172A;">Post an Internship</h2>
                <p style="margin: 0.25rem 0 0 0; color: #64748B; font-size: 0.95rem;">Publish a new opportunity for enrolled engineering students</p>
            </div>
            <a href="{{ url_for('main.dashboard') }}" class="btn" style="background-color: #E2E8F0; color: #1E293B; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500;">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('main.create_internship') }}" class="auth-form">
            <div class="form-group">
                <label for="title">Position Title *</label>
                <input type="text" id="title" name="title" required placeholder="e.g. Backend Software Engineer Intern">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="department">Target Field / Department *</label>
                    <input type="text" id="department" name="department" required placeholder="e.g. Computer Engineering">
                </div>
                <div class="form-group">
                    <label for="location">Location / Workplace Mode *</label>
                    <input type="text" id="location" name="location" required placeholder="e.g. Remote, Hybrid, or Istanbul">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Role Description & Responsibilities *</label>
                <textarea id="description" name="description" rows="5" required placeholder="Describe key tasks, projects, and technologies involved..." style="width: 100%; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0.75rem; font-family: inherit; font-size: 0.95rem; resize: vertical;"></textarea>
            </div>

            <div class="form-group">
                <label for="requirements">Prerequisites / Desired Skills (Optional)</label>
                <textarea id="requirements" name="requirements" rows="3" placeholder="e.g. Python, Flask, Git, Relational Databases..." style="width: 100%; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0.75rem; font-family: inherit; font-size: 0.95rem; resize: vertical;"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Publish Internship Listing</button>
        </form>
    </div>
</div>
{% endblock %}
