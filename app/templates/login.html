{% extends "base.html" %}

{% block title %}Login — IMS{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Log in with your credentials to access your dashboard</p>

    <form method="POST" action="{{ url_for('main.login') }}" class="auth-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="e.g. user@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a></p>
</div>
{% endblock %}
